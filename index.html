<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicolas Ventures</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .tagline {
            font-size: 1.1rem;
            color: #bdc3c7;
            margin-bottom: 2rem;
        }
        .divider {
            width: 60px;
            height: 3px;
            background-color: #3498db;
            margin: 0 auto 2rem;
        }
        .message {
            font-size: 1.3rem;
            color: #ecf0f1;
            margin-bottom: 1rem;
        }
        .sub {
            color: #95a5a6;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nicolas Ventures</h1>
        <p class="tagline">Helping people with special needs help themselves</p>
        <div class="divider"></div>
        <p class="message">Under Construction</p>
        <p class="sub">Something new is on the way. Check back soon.</p>
    </div>
</body>
</html>
